# Publica o site no GitHub Pages.
# Roda quando algo chega na branch main (por exemplo, ao mesclar um PR)
# e também pode ser disparado à mão na aba Actions ("Run workflow").
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Só uma publicação por vez; a mais nova substitui a que estiver na fila.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório (com o Preambulo e o Strata, nas versões fixadas)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Instalar o LaTeX (para as figuras)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended poppler-utils

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Montar o site (só os arquivos públicos)
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -r disciplinas motor _site/
          # Macros do Preambulo, lidas pelo motor/fol.js
          cp vendor/Preambulo/fol-MathJax.sty _site/motor/
          # Editor das aulas (Strata.viz), na versão fixada pelo submodule
          mkdir _site/strata
          cp vendor/Strata.viz/strata.js vendor/Strata.viz/strata.css _site/strata/

      - name: Compilar as figuras LaTeX das aulas
        run: node ferramentas/figuras.mjs _site vendor/Preambulo

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
